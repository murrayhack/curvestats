<!doctype html>
<!-- Source for the extension icons. Emoji graphics: Twemoji (https://github.com/jdecked/twemoji), CC-BY 4.0. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  .icon { position: relative; width: 128px; height: 128px; }
  .icon img { position: absolute; }
  .snake    { width: 84px; left: 0;    bottom: 0; }  /* 🐍 */
  .fever    { width: 54px; left: 2px;  top: 0; }     /* 🥵 */
  .download { width: 58px; right: 0;   top: 6px; }  /* 📥 */
</style></head>
<body><div class="icon">
  <img class="snake" src="twemoji/1f40d.svg">
  <img class="fever" src="twemoji/1f975.svg">
  <img class="download" src="twemoji/1f4e5.svg">
</div></body></html>
