<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; margin: 12px; color: #112d45; min-width: 360px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    p { color: #666; font-size: 12px; margin: 4px 0 10px; }
    button { padding: 6px 14px; cursor: pointer; }
    #status { margin-left: 8px; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <label for="dashboardUrl">Dashboard URL</label>
  <input id="dashboardUrl" type="url" placeholder="https://curvefever.example.com">
  <p>Your Curve Fever dashboard. When "Open dashboard" is ticked, its Import page opens after an export and the file is imported automatically. Leave empty to turn it off.</p>
  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
